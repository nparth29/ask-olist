# 30 question -> SQL pairs, drafted first. Parth checks every result and sets `verified: true` himself.
# Only verified examples go into the RAG index. `traps` lists the data-trap numbers (as numbered in the README) each one shows.

- id: ex01
  question: "What was the total product revenue in 2018?"
  tables: [orders, order_items]
  traps: [3, 4]
  verified: true
  sql: |
    SELECT ROUND(SUM(oi.price), 2) AS product_revenue
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.order_status = 'delivered'
      AND strftime('%Y', o.order_purchase_timestamp) = '2018'

- id: ex02
  question: "What was the total revenue including shipping in 2017?"
  tables: [orders, order_items]
  traps: [3, 4]
  verified: true
  sql: |
    SELECT ROUND(SUM(oi.price + oi.freight_value), 2) AS revenue_including_freight
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.order_status = 'delivered'
      AND strftime('%Y', o.order_purchase_timestamp) = '2017'

- id: ex03
  question: "How many orders are there in each order status?"
  tables: [orders]
  traps: [4]
  verified: true
  sql: |
    SELECT order_status, COUNT(*) AS orders
    FROM orders
    GROUP BY order_status
    ORDER BY orders DESC

- id: ex04
  question: "What are the top 10 product categories by product revenue?"
  tables: [orders, order_items, products, category_translation]
  traps: [3, 4, 6]
  verified: true
  sql: |
    SELECT COALESCE(t.product_category_name_english, p.product_category_name, 'unknown') AS category,
           ROUND(SUM(oi.price), 2) AS product_revenue
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    LEFT JOIN category_translation t ON t.product_category_name = p.product_category_name
    WHERE o.order_status = 'delivered'
    GROUP BY category
    ORDER BY product_revenue DESC
    LIMIT 10

- id: ex05
  question: "Which 5 customer states have the most late deliveries?"
  tables: [orders, customers]
  traps: [5]
  verified: true
  sql: |
    SELECT c.customer_state, COUNT(*) AS late_orders
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND o.order_estimated_delivery_date IS NOT NULL
      AND o.order_delivered_customer_date > o.order_estimated_delivery_date
    GROUP BY c.customer_state
    ORDER BY late_orders DESC
    LIMIT 5

- id: ex06
  question: "What percentage of delivered orders arrived later than the estimated date?"
  tables: [orders]
  traps: [5]
  verified: true
  sql: |
    SELECT ROUND(100.0 * SUM(order_delivered_customer_date > order_estimated_delivery_date) / COUNT(*), 2) AS pct_late
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
      AND order_estimated_delivery_date IS NOT NULL

- id: ex07
  question: "Which 5 customer states have the longest average delivery time in days?"
  tables: [orders, customers]
  traps: [4]
  verified: true
  sql: |
    SELECT c.customer_state,
           ROUND(AVG(julianday(o.order_delivered_customer_date) - julianday(o.order_purchase_timestamp)), 1) AS avg_delivery_days
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY c.customer_state
    ORDER BY avg_delivery_days DESC
    LIMIT 5

